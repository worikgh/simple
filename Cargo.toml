
[package]
edition = "2024"
name = "simple"
description = "The simplest graphics library, inspired by LOVE2D"
version = "0.3.2"
repository = "https://github.com/worikgh/simple,git"
keywords = ["simple","graphics","2D"]
authors = ["Alexander Campbell <alexanderhcampbell@gmail.com>, Worik Stanton <root@worik.org>"]
license = "Zlib"
readme = "README.md"

[lib]
name = "simple"
path = "src/lib.rs"

[dependencies]
libc = "0.1.8"
rand = "0.3.8"
num = "0.1.24"

[dependencies.sdl2]
version = "0.38.0"
default-features = false
features = ["image", "unsafe_textures"]


[[example]]
name = "qzn3t"
path = "examples/qzn3t.rs"